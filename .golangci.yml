version: "2"
run:
  tests: true
  relative-path-mode: wd
  allow-parallel-runners: true
output:
  formats:
    tab:
      path: stdout
      colors: false
linters:
  default: none
  enable:
    - asasalint
    - dupl
    - cyclop
    - copyloopvar
    - funcorder
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - durationcheck
    - errcheck
    - errchkjson
    - errorlint
    - exhaustive
    - gocheckcompilerdirectives
    - gochecksumtype
    - goconst
    - gocognit
    - godot
    - goheader
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - gosmopolitan
    - govet
    - iface
    - interfacebloat
    - ineffassign
    - inamedparam
    - ireturn
    - lll
    - loggercheck
    - makezero
    - misspell
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - noctx
    - perfsprint
    - prealloc
    - protogetter
    - reassign
    - recvcheck
    - rowserrcheck
    - spancheck
    - staticcheck
    - testifylint
    - tagalign
    - unconvert
    - testpackage
    - unparam
    - unused
    - zerologlint
    - wsl_v5
  settings:
    dupl:
      threshold: 100
    goconst:
      min-len: 3
      min-occurrences: 5
    gocritic:
      enabled-tags:
        - performance
      settings:
        captLocal:
          paramsOnly: true
        rangeValCopy:
          sizeThreshold: 32
    gocyclo:
      min-complexity: 10
    lll:
      line-length: 130
      tab-width: 1
    misspell:
      locale: US
    nakedret:
      max-func-lines: 30
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    unparam:
      check-exported: false
    unused:
      exported-fields-are-used: false
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupl
          - errcheck
          - goconst
          - gocognit
          - gocyclo
          - cyclop
          - gosec
          - scopelint
          - unparam
        path: _test(ing)?\.go
      - linters:
          - gosec
        text: "G306:"
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 0
  new: false
formatters:
  enable:
    - gofmt
    - goimports
    - golines
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/donaldgifford/rex
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
